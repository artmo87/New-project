/* Therapist Copilot — layout: single column, 640px max, bottom tab bar; cards only for insight blocks. */
:root {
  --bg: #F5F7F4;
  --surface: #FFFFFF;
  --surface-2: #ECF1EE;
  --fg: #1E2A26;
  --muted: #5F6E67;
  --line: #DCE3DF;
  --accent: #2E7B68;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDE6;
  --danger: #B3463D;
  --danger-soft: #F6E1DF;
  --warn: #9A6B16;
  --warn-soft: #F7EBD2;
  --rec: #D64B45;
  --shadow: 0 1px 2px rgba(20, 40, 32, 0.06), 0 6px 20px rgba(20, 40, 32, 0.06);
  --radius: 14px;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-read: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121A17; --surface: #1A2420; --surface-2: #22302A; --fg: #E6EDE9; --muted: #9AAAA2; --line: #2B3832;
    --accent: #6FC3AC; --accent-ink: #0F1A16; --accent-soft: #1F3A33; --danger: #E57E76; --danger-soft: #3A2320;
    --warn: #E0B35B; --warn-soft: #3A3120; --rec: #F0655E; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A17; --surface: #1A2420; --surface-2: #22302A; --fg: #E6EDE9; --muted: #9AAAA2; --line: #2B3832;
  --accent: #6FC3AC; --accent-ink: #0F1A16; --accent-soft: #1F3A33; --danger: #E57E76; --danger-soft: #3A2320;
  --warn: #E0B35B; --warn-soft: #3A3120; --rec: #F0655E; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; line-height: 1.2; }
h1 { font-size: 1.7rem; font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.tiny { font-size: 0.78rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.read { font-family: var(--font-read); font-size: 1.08rem; line-height: 1.55; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* App frame */
#app { min-height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 0 16px; padding-block: 8px calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 6px; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.topbar h1 { flex: 1; min-width: 0; font-size: 1.45rem; }
.topbar .back { background: none; border: 0; padding: 6px 8px 6px 0; color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(4, 1fr); max-width: 640px; margin: 0 auto;
}
@media (min-width: 640px) { .tabbar { border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-radius: 16px 16px 0 0; } }
.tabbar button { background: none; border: 0; color: var(--muted); font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border-radius: 10px; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* Cards & lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.plain { border: 0; background: var(--surface-2); }

.field label { font-size: 0.85rem; font-weight: 600; color: var(--muted); }

.rec-screen { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); gap: 12px; max-width: 640px; margin: 0 auto; width: 100%; }
.rec-head { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; }

.meter i { display: block; width: 5px; height: 6px; border-radius: 3px; background: var(--line); transition: height 0.08s linear, background 0.08s linear; }

.live .partial { color: var(--muted); }

.rec-controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.rec-controls .stop { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--rec); color: #fff; display: inline-flex; align-items: center; justify-content: center; justify-self: center; }

.seg textarea { width: 100%; }
.quote { border-left: 3px solid var(--accent-soft); padding-left: 10px; color: var(--muted); font-style: italic; }
.bar-row { display: grid; grid-template-columns: 110px 1fr auto; align-items: center; gap: 10px; font-size: 0.9rem; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

.check button.box { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: none; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink); margin-top: 1px; }
.check button.box[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check .txt { flex: 1; min-width: 0; }

.moment:first-child { border-top: 0; }
.menu { position: absolute; right: 0; top: 48px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 220px; z-index: 20; overflow: hidden; }
.menu button { background: none; border: 0; text-align: left; padding: 12px 14px; border-top: 1px solid var(--line); font-weight: 500; }
.menu button:first-child { border-top: 0; }
.menu button.danger { color: var(--danger); }
.menu-anchor { position: relative; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-ui); font-size: 11px; fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }

.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.before { stroke: var(--muted); stroke-dasharray: 4 3; }
.chart .area { fill: var(--accent); opacity: 0.12; }

.legend { display: flex; gap: 14px; font-size: 0.78rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }

.lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }

<script>
/* ./js/db.js */
/* IndexedDB storage. Everything the app knows lives here, in this browser only.
   Falls back to in-memory storage (with a warning) when IndexedDB is unavailable, e.g. some private modes. */
const DB = (() => {
  const NAME = 'therapist-copilot';
  const VERSION = 1;
  const STORES = ['sessions', 'audio', 'journal', 'settings', 'chunks'];
  let dbPromise = null;
  let memory = null;      // Map per store when IndexedDB fails
  const api = { volatile: false };

  function useMemory() {
    if (!memory) { memory = {}; for (const s of STORES) memory[s] = new Map(); api.volatile = true; }
    return memory;
  }
  function keyOf(store, value) { return store === 'settings' ? value.key : value.id; }

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(NAME, VERSION); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of STORES) {
          if (!db.objectStoreNames.contains(s)) {
            const os = db.createObjectStore(s, { keyPath: s === 'settings' ? 'key' : 'id' });
            if (s === 'chunks') os.createIndex('bySession', 'sessionId', { unique: false });
          }
        }
      };
      req.onsuccess = () => { const db = req.result; db.onversionchange = () => db.close(); resolve(db); };
      req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    });
    dbPromise.catch(() => { useMemory(); });
    return dbPromise;
  }

  async function run(store, mode, work) {
    let db;
    try { db = await open(); } catch (e) { db = null; }
    if (!db) {
      const m = useMemory()[store];
      return work({
        getAll: () => fake(Array.from(m.values())),
        get: (k) => fake(m.get(k)),
        put: (v) => { m.set(keyOf(store, v), v); return fake(keyOf(store, v)); },
        delete: (k) => { m.delete(k); return fake(undefined); },
        clear: () => { m.clear(); return fake(undefined); },
        index: () => ({ getAll: (k) => fake(Array.from(m.values()).filter((v) => v.sessionId === k)) })
      }, true);
    }
    return new Promise((resolve, reject) => {
      let t;
      try { t = db.transaction(store, mode); } catch (e) { reject(e); return; }
      const os = t.objectStore(store);
      let result;
      let request = null;
      try { request = work(os, false); } catch (e) { reject(e); return; }
      t.oncomplete = () => resolve(request && 'result' in request ? request.result : result);
      t.onerror = () => reject(t.error || new Error('IndexedDB transaction failed'));
      t.onabort = () => reject(t.error || new Error('IndexedDB transaction aborted'));
    });
  }
  function fake(result) { return { result }; }

  api.getAll = (store) => run(store, 'readonly', (os) => os.getAll());
  api.get = (store, key) => run(store, 'readonly', (os) => os.get(key));
  api.put = (store, value) => run(store, 'readwrite', (os) => os.put(value));
  api.del = (store, key) => run(store, 'readwrite', (os) => os.delete(key));
  api.clear = (store) => run(store, 'readwrite', (os) => os.clear());

  // Sessions
  api.loadSessions = async () => {
    const all = (await api.getAll('sessions')) || [];
    return all.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  };
  api.saveSession = (s) => api.put('sessions', s);
  api.deleteSession = async (id) => { await api.del('sessions', id); await api.deleteAudio(id); await api.deleteChunks(id); };

  // Audio (one blob per session)
  api.saveAudio = (id, blob, mime) => api.put('audio', { id, blob, mime: mime || blob.type || '', size: blob.size, savedAt: new Date().toISOString() });
  api.getAudio = async (id) => (await api.get('audio', id)) || null;
  api.deleteAudio = (id) => api.del('audio', id);

  // Progressive chunks while recording (crash recovery)
  api.saveChunk = (sessionId, index, blob) => api.put('chunks', { id: sessionId + ':' + String(index).padStart(6, '0'), sessionId, index, blob });
  api.getChunks = async (sessionId) => {
    const all = await run('chunks', 'readonly', (os, isMemory) => isMemory ? os.index().getAll(sessionId) : os.index('bySession').getAll(sessionId));
    return (all || []).sort((a, b) => a.index - b.index);
  };
  api.deleteChunks = async (sessionId) => {
    const chunks = await api.getChunks(sessionId);
    for (const c of chunks) await api.del('chunks', c.id);
  };
  api.chunkSessionIds = async () => {
    const all = (await api.getAll('chunks')) || [];
    return Array.from(new Set(all.map((c) => c.sessionId)));
  };

  // Journal
  api.loadJournal = async () => ((await api.getAll('journal')) || []).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  api.saveJournalEntry = (e) => api.put('journal', e);
  api.deleteJournalEntry = (id) => api.del('journal', id);

  // Settings (single record)
  api.loadSettings = async () => { const rec = await api.get('settings', 'app'); return (rec && rec.value) || {}; };
  api.saveSettings = (value) => api.put('settings', { key: 'app', value });
  api.loadDraft = async () => { const rec = await api.get('settings', 'draft'); return (rec && rec.value) || null; };
  api.saveDraft = (value) => api.put('settings', { key: 'draft', value });
  api.clearDraft = () => api.del('settings', 'draft');

  api.clearAll = async () => { for (const s of STORES) await api.clear(s); };
  api.estimate = async () => {
    try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) { /* ignore */ }
    return null;
  };
  api.persist = async () => {
    try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) { /* ignore */ }
    return false;
  };
  api.persisted = async () => {
    try { if (navigator.storage && navigator.storage.persisted) return await navigator.storage.persisted(); } catch (e) { /* ignore */ }
    return false;
  };
  return api;
})();

<script>
/* ./js/transcriber.js */
/* Live transcription on top of the browser's built-in speech recognition (Web Speech API).
   The recognizer restarts itself whenever the browser ends a run, so a 50-minute session is
   transcribed as a chain of short runs. Each final result becomes a timestamped segment.
   No audio is sent to this app's authors or to any third party; recognition is done by the
   browser/OS (on iPhone that is Apple's dictation service, on Chrome Google's or on-device). */
class LiveTranscriber {
  static get Recognition() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
  static isSupported() { return !!LiveTranscriber.Recognition; }

  /** On-device availability for Chrome's local recognition. Resolves 'available' | 'downloadable' | 'downloading' | 'unavailable' | 'unsupported'. */
  static async localAvailability(lang) {
    const R = LiveTranscriber.Recognition;
    if (!R || typeof R.available !== 'function') return 'unsupported';
    try { return await R.available({ langs: [lang], processLocally: true }); } catch (e) { return 'unsupported'; }
  }
  static async installLocal(lang) {
    const R = LiveTranscriber.Recognition;
    if (!R || typeof R.install !== 'function') return false;
    try { return await R.install({ langs: [lang], processLocally: true }); } catch (e) { return false; }
  }

  constructor(opts) {
    this.lang = opts.lang || 'en-US';
    this.clock = opts.clock || (() => 0);
    this.onPartial = opts.onPartial || (() => {});
    this.onSegment = opts.onSegment || (() => {});
    this.onWarning = opts.onWarning || (() => {});
    this.onFatal = opts.onFatal || (() => {});
    this.preferLocal = !!opts.preferLocal;
    this.active = false;
    this.paused = false;
    this.stopping = false;
    this.rec = null;
    this.utteranceStart = null;
    this.lastPartial = '';
    this.runStartedAt = 0;
    this.gotResultsThisRun = false;
    this.quickEnds = 0;
    this.networkErrors = 0;
    this.captureErrors = 0;
    this.restartTimer = null;
    this.endResolvers = [];
    this.segmentCount = 0;
  }

  start() {
    if (!LiveTranscriber.isSupported()) throw new Error('Speech recognition is not available in this browser.');
    this.active = true;
    this.paused = false;
    this.stopping = false;
    this._startRun(0);
  }

  pause() {
    if (!this.active || this.paused) return;
    this.paused = true;
    clearTimeout(this.restartTimer);
    this._stopRun();
  }

  resume() {
    if (!this.active || !this.paused) return;
    this.paused = false;
    this._startRun(0);
  }

  /** Stops recognition and resolves once the last results are in (or after a short timeout). */
  async stop() {
    if (!this.active) return;
    this.active = false;
    this.stopping = true;
    clearTimeout(this.restartTimer);
    if (this.rec) {
      await new Promise((resolve) => {
        this.endResolvers.push(resolve);
        setTimeout(resolve, 2500);

    for (const p of splitSentences(full, lang)) {
      let idx = full.indexOf(p, cursor);
      if (idx === -1) idx = cursor;
      cursor = idx + p.length;
      const toks = words(p);
      if (toks.length < 3) continue;
      const s = { text: trimDangling(p), time: timeAt(idx), toks, padded: ' ' + toks.join(' ') + ' ' };
      s.content = toks.map(stem).filter((w) => w.length > 2 && !STOP.has(w));
      s.sentiment = sentimentOf(s);
      sentences.push(s);
    }
    return sentences;
  }

  const DANGLING = new Set(['to', 'with', 'of', 'and', 'the', 'a', 'an', 'in', 'on', 'at', 'for', 'or', 'but', 'so', 'that', 'instead', 'because', 'which', 'when', 'if', 'like', 'about', 'from', 'as', 'than', 'then', 'just', 'really', 'very', 'i', 'im', 'my', 'is', 'was', 'be', 'it', 'its']);
  function trimDangling(text) {
    let t = String(text || '').trim().replace(/[\s,;:\-–—]+$/g, '');
    for (let guard = 0; guard < 6; guard++) {
      const m = t.match(/(\S+)$/);
      if (!m) break;
      const last = normalize(m[1]);
      if (!DANGLING.has(last)) break;
      t = t.slice(0, m.index).trim().replace(/[\s,;:\-–—]+$/g, '');
    }
    return t;
  }

  function capitalize(t) { t = t.trim().replace(/^["'“‘]+|["'”’]+$/g, ''); return t ? t[0].toUpperCase() + t.slice(1) : t; }
  function tidy(t) { t = capitalize(t); if (t && !/[.!?]$/.test(t)) t += '.'; return t; }
  function trimTo(t, n) { return t.length <= n ? t : t.slice(0, n - 1).replace(/\s+\S*$/, '') + '…'; }
  function fill(template, n, theme) {
    return String(template || '')
      .replace(/\{n\} times?/g, n === 1 ? 'once' : n + ' times')
      .replace(/\{n\}/g, String(n))
      .replace(/\{theme\}/g, theme);
  }
  function joinList(items) {
    if (!items.length) return '';
    if (items.length === 1) return items[0];
    if (items.length === 2) return items[0] + ' and ' + items[1];
    return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
  }
  function lower(s) { return s.replace(/^([A-Z])(?![A-Z])/, (m) => m.toLowerCase()); }

  function empty(language) {
    return {
      engine: 'classic', generatedAt: new Date().toISOString(),
      overview: 'No transcript was captured for this session, so there is nothing to analyze yet. You can still listen to the recording and write notes.',
      highlights: [], themes: [], emotions: [], keyMoments: [], thoughtPatterns: [], suggestions: [], detectedActionItems: [],
      questionsForNextSession: [], moodTrajectory: [], overallSentiment: 0, needsSupportFlag: false, languageNote: null, wordCount: 0
    };
  }

  function analyze(session, history) {
    history = history || [];
    const sentences = buildSentences(session);
    const language = session.language || 'en-US';
    if (!sentences.length) return empty(language);
    const fullText = ' ' + normalize((session.segments || []).map((s) => s.text).join(' ')) + ' ';
    const wordCount = fullText.trim().split(' ').filter(Boolean).length;
    const minutes = Math.max(1, Math.round((session.duration || 0) / 60));

    // Themes
    const themeHits = THEMES.map((t) => {
      let mentions = 0; let quote = null; const hitSentences = [];
      for (const s of sentences) { const c = countMatches(s, t.m); if (c) { mentions += c; hitSentences.push(s); } }
      if (hitSentences.length) {
        const good = hitSentences.filter((s) => s.toks.length >= 6).sort((a, b) => a.toks.length - b.toks.length);
        quote = (good[0] || hitSentences[0]).text;
      }
      return { def: t, mentions, quote, hitSentences };
    }).filter((t) => t.mentions > 0).sort((a, b) => b.mentions - a.mentions);
    let keptThemes = themeHits.filter((t) => t.mentions >= 2);
    if (!keptThemes.length) keptThemes = themeHits.slice(0, 3);
    keptThemes = keptThemes.slice(0, 6);
    const themeSet = new Set(keptThemes.map((t) => t.def));

    // Emotions
    const emotionHits = EMOTIONS.map((e) => ({ def: e, mentions: sentences.reduce((a, s) => a + countMatches(s, e.m), 0) })).filter((e) => e.mentions > 0).sort((a, b) => b.mentions - a.mentions).slice(0, 6);
    const maxEm = emotionHits.length ? emotionHits[0].mentions : 1;
    const emotions = emotionHits.map((e) => ({ name: e.def.name, intensity: Math.round((e.mentions / maxEm) * 100) / 100, mentions: e.mentions }));

    // Thinking patterns
    const thoughtPatterns = [];
    for (const d of DISTORTIONS) {
      const hit = sentences.find((s) => hasMatch(s, d.m));
      if (hit) thoughtPatterns.push({ name: d.name, description: d.description, quote: capitalize(trimTo(hit.text, 200)), reframe: d.reframe, _s: hit });
      if (thoughtPatterns.length >= 4) break;
    }

    // Commitments
    const seenCommit = new Set();
    const detectedActionItems = [];
    const commitSentences = new Set();
    for (const s of sentences) {
      if (!hasMatch(s, COMMIT)) continue;
      commitSentences.add(s);
      const txt = tidy(trimTo(s.text, 160));
      const key = normalize(txt);
      if (seenCommit.has(key)) continue;
      seenCommit.add(key);
      detectedActionItems.push(txt);
      if (detectedActionItems.length >= 8) break;
    }

    // Key moments
    const distortionSentences = new Set(thoughtPatterns.map((p) => p._s));
    const scored = sentences.map((s) => {
      const themeHitsHere = keptThemes.reduce((a, t) => a + countMatches(s, t.def.m), 0);
      const insight = hasMatch(s, INSIGHT);
      const commit = commitSentences.has(s);
      const distortion = distortionSentences.has(s);
      let score = Math.abs(s.sentiment) * 2 + themeHitsHere * 0.5 + (commit ? 1.5 : 0) + (distortion ? 1 : 0) + (insight ? 1.5 : 0);
      if (s.toks.length < 5) score *= 0.6;
      let reason = 'Core theme';
      if (insight) reason = 'Insight'; else if (commit) reason = 'Commitment'; else if (Math.abs(s.sentiment) >= 0.35) reason = 'Strong emotion'; else if (distortion) reason = 'Thinking pattern';
      return { s, score, reason };
    }).filter((x) => x.score > 0.6).sort((a, b) => b.score - a.score).slice(0, 5).sort((a, b) => a.s.time - b.s.time);
    const keyMoments = scored.map((x) => ({ time: x.s.time, text: capitalize(trimTo(x.s.text, 220)), reason: x.reason }));

    // Highlights (extractive)
    const freq = new Map();
    for (const s of sentences) for (const w of s.content) freq.set(w, (freq.get(w) || 0) + 1);
    const n = sentences.length;
    const hl = sentences.map((s, i) => {
      let sum = 0; for (const w of s.content) sum += (freq.get(w) || 0);
      let score = s.content.length ? sum / Math.sqrt(s.content.length + 1) : 0;
      if (i < n * 0.1 || i > n * 0.9) score += 0.3;
      score += keptThemes.reduce((a, t) => a + (hasMatch(s, t.def.m) ? 0.8 : 0), 0);
      if (s.toks.length < 6) score *= 0.5;
      return { s, score };
    }).sort((a, b) => b.score - a.score);
    const highlights = [];
    const usedKeys = new Set();
    for (const h of hl) {
      const key = h.s.content.slice(0, 6).join(' ');
      if (usedKeys.has(key)) continue;
      usedKeys.add(key);
      highlights.push(h);
      if (highlights.length >= 5) break;
    }
    highlights.sort((a, b) => a.s.time - b.s.time);
    const highlightTexts = highlights.map((h) => tidy(trimTo(h.s.text, 180)));

    // Mood trajectory (8 buckets)
    const span = Math.max(session.duration || 0, (sentences[sentences.length - 1].time || 0) + 1, 1);
    const buckets = Array.from({ length: 8 }, () => []);
    for (const s of sentences) { const b = Math.min(7, Math.floor((s.time / span) * 8)); buckets[b].push(s.sentiment); }
    const traj = buckets.map((b) => (b.length ? b.reduce((a, v) => a + v, 0) / b.length : null));
    for (let i = 0; i < traj.length; i++) {
      if (traj[i] != null) continue;
      let l = i - 1; while (l >= 0 && traj[l] == null) l--;
      let r = i + 1; while (r < traj.length && traj[r] == null) r++;
      const lv = l >= 0 ? traj[l] : null, rv = r < traj.length ? traj[r] : null;
      traj[i] = lv != null && rv != null ? lv + ((rv - lv) * (i - l)) / (r - l) : (lv != null ? lv : (rv != null ? rv : 0));
    }
    const moodTrajectory = traj.map((v) => Math.round(v * 100) / 100);
    const overallSentiment = Math.round((sentences.reduce((a, s) => a + s.sentiment, 0) / sentences.length) * 100) / 100;
    const q = Math.max(1, Math.floor(sentences.length / 4));
    const firstQ = sentences.slice(0, q).reduce((a, s) => a + s.sentiment, 0) / q;
    const lastQ = sentences.slice(-q).reduce((a, s) => a + s.sentiment, 0) / q;
    const trend = lastQ - firstQ > 0.12 ? 'lifted' : (lastQ - firstQ < -0.12 ? 'dipped' : 'steady');

    // Overview
    const themeNames = keptThemes.slice(0, 3).map((t) => lower(t.def.name));
    const emotionNames = emotions.slice(0, 2).map((e) => e.name.toLowerCase());
    const parts = [];
    let first = 'In this ' + minutes + '-minute session you ';
    first += themeNames.length ? 'mainly talked about ' + joinList(themeNames) + '.' : 'covered a lot of ground.';
    parts.push(first);
    if (emotionNames.length) {
      const em = joinList(emotionNames);
      const toneWord = trend === 'lifted' ? 'and the tone lifted toward the end' : (trend === 'dipped' ? 'and the tone grew heavier toward the end' : 'and the tone stayed fairly steady throughout');
      parts.push(capitalize(em) + ' came through most often, ' + toneWord + '.');
    } else {
      parts.push(trend === 'lifted' ? 'The tone lifted toward the end.' : (trend === 'dipped' ? 'The tone grew heavier toward the end.' : 'The tone stayed fairly steady throughout.'));
    }
    if (detectedActionItems.length) parts.push('You made ' + Fmt.plural(detectedActionItems.length, 'commitment') + ' for the time until your next session.');
    if (thoughtPatterns.length) parts.push('A few thinking patterns showed up that might be worth a gentle second look.');
    const overview = parts.join(' ');

    // Suggestions
    const suggestions = [];
    const titles = new Set();
    const titleKey = (t) => words(t).map(stem).filter((w) => !STOP.has(w) && w.length > 2).sort().join(' ');
    const push = (sug) => { if (!sug.title) return; const k = titleKey(sug.title); if (titles.has(k)) return; titles.add(k); suggestions.push({ id: 'sg-' + suggestions.length, ...sug }); };
    for (const t of keptThemes) {
      for (const s of (t.def.suggestions || []).slice(0, 2)) push({ category: s.category, title: s.title, detail: s.detail, rationale: fill(s.rationale, t.mentions, t.def.name) });
    }
    const emotionDriven = {
      Overwhelmed: { category: 'practice', title: 'Name five things you can see, four you can touch', detail: 'When everything feels like too much, slow down with 5-4-3-2-1 grounding: five things you see, four you can feel, three you hear, two you smell, one you taste. It pulls attention out of the spiral and into the room.', rationale: 'Feeling overwhelmed came up {n} times.' },
      Anxious: { category: 'practice', title: 'Give the adrenaline somewhere to go', detail: 'When anxiety peaks, do one physical thing for five minutes: wash the dishes, walk around the block, take a shower. The body is primed to move; letting it usually shortens the spike.', rationale: 'Anxiety came through {n} times.' },
      Exhausted: { category: 'selfCare', title: 'Protect one early night this week', detail: 'Pick a night, decide the time you will be in bed, and tell someone. Tiredness makes every other problem louder.', rationale: 'Exhaustion came up {n} times.' },
      Lonely: { category: 'practice', title: 'Send one low-stakes message today', detail: 'Not a plan, not a big talk: a photo, a memory, a question. Connection usually restarts with something small.', rationale: 'Loneliness came up {n} times.' },
      Ashamed: { category: 'reflection', title: 'Write what you would say to a friend in your place', detail: 'Describe the situation as if it happened to someone you care about, then write them two sentences. Read them back to yourself.', rationale: 'Shame or self-criticism came up {n} times.' },
      Angry: { category: 'practice', title: 'Catch anger at the first sign in your body', detail: 'Notice the earliest physical cue (jaw, chest, heat) and take a 10-minute break before responding. Decide what you want the outcome to be before you speak.', rationale: 'Anger or irritability came up {n} times.' },
      Hopeful: { category: 'reflection', title: 'Write down what gave you hope today', detail: 'Hope tends to evaporate by midweek. One or two lines about what felt possible in this session keeps it reachable.', rationale: 'Hope came through {n} times.' },
      Sad: { category: 'selfCare', title: 'Plan one small pleasant activity', detail: 'Choose something short and concrete for tomorrow (a walk, a call, music). Mood often follows action rather than the other way round.', rationale: 'Sadness came up {n} times.' },
      Guilty: { category: 'reflection', title: 'Separate what you did from who you are', detail: 'Write the specific action you feel guilty about, what you can repair or learn, and one sentence that is true about you beyond that moment.', rationale: 'Guilt came up {n} times.' }
    };
    let emotionAdded = 0;
    for (const e of emotionHits) { const d = emotionDriven[e.def.name]; if (d && emotionAdded < 2) { push({ ...d, rationale: fill(d.rationale, e.mentions, e.def.name) }); emotionAdded++; } }
    for (const p of thoughtPatterns) {
      push({ category: 'reflection', title: 'Look again at a moment of ' + lower(p.name), detail: p.reframe, rationale: 'You said: “' + trimTo(p.quote, 120) + '”' });
    }
    // Cross-session patterns
    const recent = history.filter((h) => h && h.insights && h.insights.themes).slice(0, 6);
    for (const t of keptThemes) {
      const count = recent.filter((h) => h.insights.themes.some((x) => x.name === t.def.name)).length;
      if (count >= 2) {
        push({ category: 'pattern', title: t.def.name + ' keeps coming back', detail: t.def.name + ' has come up in ' + count + ' of your last ' + recent.length + ' sessions as well as this one. It might be worth asking your therapist whether this deserves a session of its own, or whether something underneath it connects them.', rationale: 'Seen in ' + (count + 1) + ' of your last ' + (recent.length + 1) + ' sessions.' });
      }
    }
    for (const g of Lexicon.generalSuggestions.slice(0, 2)) push({ category: g.category, title: g.title, detail: g.detail, rationale: fill(g.rationale, detectedActionItems.length, 'this session') });
    const finalSuggestions = suggestions.slice(0, 10);

    // Questions for next session
    const questions = [];
    const qSeen = new Set();
    for (const t of keptThemes) for (const qq of (t.def.questions || []).slice(0, 1)) { const k = normalize(qq); if (!qSeen.has(k)) { qSeen.add(k); questions.push(qq); } }
    for (const t of keptThemes) for (const qq of (t.def.questions || []).slice(1, 2)) { if (questions.length >= 4) break; const k = normalize(qq); if (!qSeen.has(k)) { qSeen.add(k); questions.push(qq); } }
    for (const p of thoughtPatterns) { if (questions.length >= 6) break; questions.push('Could we look at the thought “' + trimTo(p.quote, 90) + '” together?'); }

    const needsSupportFlag = CRISIS.phrases.some((p) => fullText.includes(p)) || fullText.split(' ').some((w) => CRISIS.single.has(w));
    const langCode = language.slice(0, 2).toLowerCase();
    const languageNote = langCode && langCode !== 'en' ? 'Insights are tuned for English transcripts; results for ' + Fmt.languageName(language) + ' will be rougher.' : null;

    return {
      engine: 'classic', generatedAt: new Date().toISOString(), overview, highlights: highlightTexts,
      themes: keptThemes.map((t) => ({ name: t.def.name, mentions: t.mentions, quote: t.quote ? capitalize(trimTo(t.quote, 200)) : null })),
      emotions, keyMoments, thoughtPatterns: thoughtPatterns.map(({ _s, ...p }) => p), suggestions: finalSuggestions,
      detectedActionItems, questionsForNextSession: questions, moodTrajectory, overallSentiment, needsSupportFlag, languageNote, wordCount
    };
  }

  return { analyze, empty, normalize, stem, splitSentences };
})();

<script>
/* ./js/ondevice-ai.js */
/* Optional enrichment with the browser's built-in on-device language model (Chrome's Prompt API).
   Everything is feature-detected; when the API is missing the Classic engine's result is used as is.
   Nothing leaves the device: the model runs inside the browser. */
const OnDeviceAI = (() => {
  const INSTRUCTIONS = 'You help a person reflect on their own therapy session. Write in second person, warm and plain. Never diagnose, never give medical or medication advice, never judge the therapist. Keep each list item under 25 words. If the text mentions self-harm, respond with care and suggest contacting a crisis line, without alarm. Output only what is asked.';
  const SCHEMA = {
    type: 'object',
    properties: {
      overview: { type: 'string' },
      highlights: { type: 'array', items: { type: 'string' } },
      suggestions: { type: 'array', items: { type: 'string' } },
      questionsForNextSession: { type: 'array', items: { type: 'string' } },
      detectedCommitments: { type: 'array', items: { type: 'string' } }
    },
    required: ['overview', 'highlights', 'suggestions', 'questionsForNextSession', 'detectedCommitments']
  };

  function api() {
    if (typeof self !== 'undefined' && self.LanguageModel && typeof self.LanguageModel.create === 'function') return self.LanguageModel;
    if (typeof self !== 'undefined' && self.ai && self.ai.languageModel && typeof self.ai.languageModel.create === 'function') return self.ai.languageModel;
    return null;
  }

  async function status() {
    const LM = api();
    if (!LM) return { state: 'unsupported', label: 'Not available in this browser (Chrome on desktop offers it)' };
    try {
      const a = typeof LM.availability === 'function' ? await LM.availability() : (typeof LM.capabilities === 'function' ? (await LM.capabilities()).available : 'unavailable');
      const map = { available: 'Available', readily: 'Available', downloadable: 'Available after a one-time model download', 'after-download': 'Available after a one-time model download', downloading: 'Model is downloading', unavailable: 'Not supported on this device', no: 'Not supported on this device' };
      const norm = a === 'readily' ? 'available' : (a === 'after-download' ? 'downloadable' : (a === 'no' ? 'unavailable' : a));
      return { state: norm, label: map[a] || 'Unavailable' };
    } catch (e) { return { state: 'unavailable', label: 'Unavailable' }; }
  }

  async function createSession(monitor) {
    const LM = api();
    const opts = { initialPrompts: [{ role: 'system', content: INSTRUCTIONS }] };
    if (monitor) opts.monitor = monitor;
    try { return await LM.create(opts); } catch (e) {
      return await LM.create({ systemPrompt: INSTRUCTIONS });
    }
  }

  async function requestDownload(onProgress) {
    const s = await status();
    if (s.state !== 'downloadable' && s.state !== 'downloading') return s;
    const session = await createSession((m) => { try { m.addEventListener('downloadprogress', (e) => onProgress && onProgress(e.loaded, e.total)); } catch (e) { /* ignore */ } });
    try { session.destroy && session.destroy(); } catch (e) { /* ignore */ }
    return status();
  }

  function chunkWords(text, size) {
    const w = text.split(/\s+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < w.length; i += size) out.push(w.slice(i, i + size).join(' '));
    return out;
  }
  function parseJSON(text) {
    try { return JSON.parse(text); } catch (e) { /* fall through */ }
    const m = text.match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch (e) { /* ignore */ } }
    return null;
  }
  function cleanList(a, cap) { return Array.isArray(a) ? a.map((x) => String(x || '').trim()).filter(Boolean).slice(0, cap) : []; }

  async function enrich(base, session) {
    const LM = api();
    if (!LM) throw new Error('No on-device model');
    const transcript = (session.segments || []).map((s) => s.text).join(' ').trim();
    if (!transcript) throw new Error('No transcript');
    const chunks = chunkWords(transcript, 1200);
    let material;
    if (chunks.length === 1) {
      material = 'Transcript of the session:\n\n' + chunkWords(transcript, 1500)[0];
    } else {
      const notes = [];
      for (let i = 0; i < chunks.length && i < 10; i++) {
        const s = await createSession();
        try {
          const r = await s.prompt('Here is part ' + (i + 1) + ' of ' + chunks.length + ' of a therapy session transcript (speakers are not labeled). Write 3 to 6 concise bullet notes capturing what was discussed, feelings expressed, insights, and any commitments.\n\n' + chunks[i]);
          notes.push(String(r || ''));
        } finally { try { s.destroy && s.destroy(); } catch (e) { /* ignore */ } }
      }
      material = 'Notes from the parts of the session, in order:\n\n' + notes.join('\n\n');
    }
    const prompt = material + '\n\nUsing only this material, return JSON with: "overview" (3 to 5 sentences, second person, what the session was about and how it moved), "highlights" (3 to 7 short bullets of what was discussed), "suggestions" (3 to 6 gentle, practical suggestions for the week ahead, each one or two sentences), "questionsForNextSession" (2 to 5 questions worth bringing to the next session), "detectedCommitments" (concrete things the person said they would do, as short imperative sentences; empty if none).';
    const s = await createSession();
    let raw;
    try {
      try { raw = await s.prompt(prompt, { responseConstraint: SCHEMA }); } catch (e) { raw = await s.prompt(prompt + '\n\nRespond with JSON only.'); }
    } finally { try { s.destroy && s.destroy(); } catch (e) { /* ignore */ } }
    const data = parseJSON(String(raw || ''));
    if (!data || typeof data.overview !== 'string' || !data.overview.trim()) throw new Error('Model returned no usable summary');

    const out = { ...base, engine: 'onDeviceModel', generatedAt: new Date().toISOString() };
    out.overview = data.overview.trim();
    const hl = cleanList(data.highlights, 7);
    if (hl.length) out.highlights = hl;
    const practiceWords = ['try', 'practice', 'write', 'schedule', 'breath', 'walk', 'exercise', 'set ', 'plan', 'list', 'notice'];
    const modelSuggestions = cleanList(data.suggestions, 6).map((t, i) => {
      const lowerT = t.toLowerCase();
      const cat = practiceWords.some((w) => lowerT.includes(w)) ? 'practice' : 'reflection';
      const firstStop = t.search(/[.!?](\s|$)/);
      const title = firstStop > 0 && firstStop < 90 ? t.slice(0, firstStop) : (t.length > 70 ? t.slice(0, 69).replace(/\s+\S*$/, '') + '…' : t);
      return { id: 'ai-' + i, category: cat, title, detail: t, rationale: 'Suggested by the on-device model from this session\'s transcript.' };
    });
    const titles = new Set(modelSuggestions.map((s) => s.title.toLowerCase()));
    const kept = (base.suggestions || []).filter((s) => s.category === 'pattern' && !titles.has(s.title.toLowerCase()));
    const extra = (base.suggestions || []).filter((s) => s.category !== 'pattern' && !titles.has(s.title.toLowerCase())).slice(0, 3);
    out.suggestions = [...modelSuggestions, ...kept, ...extra].slice(0, 10);
    const qs = cleanList(data.questionsForNextSession, 5);
    const qSeen = new Set(qs.map((q) => q.toLowerCase()));
    out.questionsForNextSession = [...qs, ...(base.questionsForNextSession || []).filter((q) => !qSeen.has(q.toLowerCase()))].slice(0, 6);
    const commits = cleanList(data.detectedCommitments, 8);
    const cSeen = new Set(commits.map((c) => c.toLowerCase()));
    out.detectedActionItems = [...commits, ...(base.detectedActionItems || []).filter((c) => !cSeen.has(c.toLowerCase()))].slice(0, 8);
    return out;
  }

  return { status, enrich, requestDownload, isSupported: () => !!api() };
})();

</script>
<script>
/* ./js/exporter.js */
/* Exports: Markdown reports, transcript text, prep sheet, full backup/restore, plus download/share/copy helpers. */
const Exporter = (() => {
  function mood(m) { return m ? m + '/10 ' + MoodScale.emoji(m) : '—'; }
  function speakerPrefix(s) { return s === 'me' ? 'Me: ' : (s === 'therapist' ? 'Therapist: ' : ''); }
  function title(session) { return (session.title || '').trim() || 'Session · ' + Fmt.shortDate(session.createdAt); }

  function transcriptText(session) {
    const lines = (session.segments || []).map((s) => '[' + Fmt.clock(s.start) + '] ' + speakerPrefix(s.speaker) + s.text);
    return lines.length ? lines.join('\n') : '(No transcript was captured for this session.)';
  }

  function report(session, opts) {
    const ins = session.insights;
    const L = [];
    L.push('# ' + title(session));
    L.push('');
    L.push('- **When:** ' + Fmt.dateTime(session.createdAt));
    L.push('- **Duration:** ' + Fmt.durationWords(session.duration || 0));
    if (session.therapistName) L.push('- **Therapist:** ' + session.therapistName);
    L.push('- **Mood before:** ' + mood(session.moodBefore) + '  ·  **Mood after:** ' + mood(session.moodAfter));
    if (session.tags && session.tags.length) L.push('- **Tags:** ' + session.tags.join(', '));
    L.push('');
    if (ins) {
      L.push('## Overview'); L.push(''); L.push(ins.overview); L.push('');
      L.push('_Generated with ' + (ins.engine === 'onDeviceModel' ? 'the on-device model' : 'classic analysis') + ' on ' + Fmt.dateTime(ins.generatedAt) + '._'); L.push('');
      if (ins.highlights && ins.highlights.length) { L.push('## Highlights'); L.push(''); ins.highlights.forEach((h) => L.push('- ' + h)); L.push(''); }
      if (ins.themes && ins.themes.length) { L.push('## Themes'); L.push(''); ins.themes.forEach((t) => L.push('- **' + t.name + '** (' + t.mentions + ')' + (t.quote ? ' — “' + t.quote + '”' : ''))); L.push(''); }
      if (ins.emotions && ins.emotions.length) { L.push('## Emotions'); L.push(''); L.push(ins.emotions.map((e) => e.name + ' (' + e.mentions + ')').join(', ')); L.push(''); }
      if (ins.keyMoments && ins.keyMoments.length) { L.push('## Key moments'); L.push(''); ins.keyMoments.forEach((k) => L.push('- [' + Fmt.clock(k.time || 0) + '] _' + k.reason + '_ — ' + k.text)); L.push(''); }
      if (ins.thoughtPatterns && ins.thoughtPatterns.length) { L.push('## Thinking patterns'); L.push(''); ins.thoughtPatterns.forEach((p) => { L.push('- **' + p.name + '** — “' + p.quote + '”'); L.push('  - Another way to see it: ' + p.reframe); }); L.push(''); }
    }
    if (session.actionItems && session.actionItems.length) { L.push('## Commitments'); L.push(''); session.actionItems.forEach((a) => L.push('- [' + (a.isDone ? 'x' : ' ') + '] ' + a.text)); L.push(''); }
    if (ins && ins.suggestions && ins.suggestions.length) {
      L.push('## Suggestions'); L.push('');
      ins.suggestions.forEach((s) => { L.push('- **' + s.title + '** (' + (CategoryMeta[s.category] ? CategoryMeta[s.category].label : s.category) + ')'); L.push('  ' + s.detail); L.push('  _' + s.rationale + '_'); });
      L.push('');
    }
    if (session.nextSessionQuestions && session.nextSessionQuestions.length) { L.push('## Questions for next session'); L.push(''); session.nextSessionQuestions.forEach((q) => L.push('- ' + q)); L.push(''); }
    if ((session.notes || '').trim()) { L.push('## Notes'); L.push(''); L.push(session.notes.trim()); L.push(''); }
    if (!opts || opts.transcript !== false) { L.push('## Transcript'); L.push(''); L.push(transcriptText(session)); L.push(''); }
    return L.join('\n');
  }

  function markdown(session) { return report(session) + '\n---\n_Exported from Therapist Copilot. This is a personal reflection aid, not medical advice._\n'; }

  function prepSheet(data) {
    const L = ['# Prep for my next session', '', '_' + Fmt.dateTime(new Date()) + '_', ''];
    L.push('## Open commitments'); L.push('');
    if (data.openItems.length) data.openItems.forEach((o) => L.push('- [ ] ' + o.item.text + '  _(' + o.sessionTitle + ')_')); else L.push('- Nothing open.');
    L.push(''); L.push('## Questions to bring'); L.push('');
    if (data.questions.length) data.questions.forEach((q) => L.push('- ' + q.question)); else L.push('- None saved yet.');
    L.push(''); L.push('## Recurring themes'); L.push('');
    if (data.themes.length) data.themes.forEach((t) => L.push('- ' + t.name + ' (' + t.sessionCount + ' sessions)')); else L.push('- Not enough sessions yet.');
    if (data.lastOverview) { L.push(''); L.push('## Last session'); L.push(''); L.push(data.lastOverview); }
    L.push('');
    return L.join('\n');
  }

  function fullExport(sessions, journal) {
    const L = ['# Therapist Copilot — full export', '', '_' + Fmt.dateTime(new Date()) + ' · ' + Fmt.plural(sessions.length, 'session') + ', ' + Fmt.plural(journal.length, 'journal entry').replace('entrys', 'entries') + '_', ''];
    for (const s of sessions.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt))) { L.push(report(s)); L.push(''); L.push('---'); L.push(''); }
    if (journal.length) {
      L.push('# Journal'); L.push('');
      for (const j of journal.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt))) { L.push('## ' + Fmt.dateTime(j.createdAt) + (j.mood ? ' · mood ' + j.mood + '/10' : '')); L.push(''); L.push(j.text); L.push(''); }
    }
    return L.join('\n');
  }

  function backup(sessions, journal, settings) {
    return JSON.stringify({ app: 'therapist-copilot', version: 1, exportedAt: new Date().toISOString(), sessions, journal, settings: settings || {} }, null, 1);
  }
  function parseBackup(text) {
    const data = JSON.parse(text);
    if (!data || data.app !== 'therapist-copilot' || !Array.isArray(data.sessions)) throw new Error('This file is not a Therapist Copilot backup.');
    return { sessions: data.sessions, journal: Array.isArray(data.journal) ? data.journal : [], settings: data.settings || {} };
  }

  function safeName(name) { return String(name || 'export').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 80) || 'export'; }

  function downloadBlob(name, blob) {
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = safeName(name); a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (e) { return false; }
  }
  function downloadText(name, text, mime) { return downloadBlob(name, new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' })); }

  async function share(opts) {
    if (!navigator.share) return false;
    try {
      if (opts.file && navigator.canShare && navigator.canShare({ files: [opts.file] })) { await navigator.share({ title: opts.title, files: [opts.file] }); return true; }
      if (opts.text) { await navigator.share({ title: opts.title, text: opts.text }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return true; }
    return false;
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch (e2) { return false; }
    }
  }
  function extensionFor(mime) {
    if (!mime) return 'webm';
    if (mime.includes('mp4') || mime.includes('aac') || mime.includes('m4a')) return 'm4a';
    if (mime.includes('ogg')) return 'ogg';
    if (mime.includes('wav')) return 'wav';
    return 'webm';
  }
  return { markdown, transcriptText, prepSheet, fullExport, backup, parseBackup, downloadText, downloadBlob, share, copy, title, safeName, extensionFor };
})();

</script>
<script>
/* ./js/app.js */
/* Therapist Copilot — application: state, routing, screens and flows. Vanilla JS, no build step. */
const App = (() => {
  const DEFAULTS = {
    language: (navigator.language && LANGUAGES.includes(navigator.language)) ? navigator.language : 'en-US',
    recordingMode: 'both',           // both | transcript | audio
    preferLocalRecognition: true,     // Chrome: keep recognition on the device when the browser offers it
    enginePreference: 'automatic',    // automatic | classic
    therapistName: '',
    hasSeenOnboarding: false,
    pinHash: null,
    pinLength: 0
  };
  const S = {
    sessions: [], journal: [], settings: { ...DEFAULTS },
    route: { name: 'home' }, ui: { tab: 'summary', search: '', menu: false, sheet: null, form: {}, confirm: null, toast: null, editingSegment: null, aiStatus: null, localStatus: null, storage: null },
    rec: null, recUI: null, pending: null, processing: null,
    player: { sessionId: null, url: null, rate: 1, current: 0, failed: false },
    locked: false, pinEntry: '', pinSetup: null, draftSaver: null, ready: false
  };
  const $ = (sel) => document.querySelector(sel);
  const app = () => document.getElementById('app');

  // ---------- persistence helpers ----------
  async function saveSettings() { try { await DB.saveSettings(S.settings); } catch (e) { toast('Settings could not be saved in this browser.'); } }
  function getSession(id) { return S.sessions.find((s) => s.id === id) || null; }
  async function persistSession(s) { try { await DB.saveSession(s); } catch (e) { toast('Could not save to this browser\'s storage.'); } }
  async function updateSession(id, fn) {
    const s = getSession(id); if (!s) return null;
    fn(s); s.updatedAt = new Date().toISOString();
    await persistSession(s);
    return s;
  }
  function sortSessions() { S.sessions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); }

  // ---------- routing ----------
  function routeToHash(r) {
    if (r.name === 'session') return '#s-' + r.id;
    return '#' + (r.name || 'home');
  }
  function hashToRoute(h) {
    h = (h || '').replace(/^#/, '');
    if (!h) return { name: 'home' };
    if (h.startsWith('s-')) return { name: 'session', id: h.slice(2) };
    if (['home', 'sessions', 'prepare', 'settings', 'how', 'notes'].includes(h)) return { name: h };
    return { name: 'home' };
  }
  function navigate(route, replace) {
    S.ui.menu = false; S.ui.confirm = null; S.ui.sheet = null;
    if (route.name !== 'session') { releasePlayer(); S.ui.tab = 'summary'; S.ui.editingSegment = null; }
    S.route = route;
    const h = routeToHash(route);
    if (location.hash !== h) { if (replace) history.replaceState(null, '', h); else location.hash = h; }
    render();
    window.scrollTo(0, 0);
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg) {
    S.ui.toast = msg;
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; S.ui.toast = null; }, 3600);
  }

  // ---------- small view helpers ----------
  function icon(name, cls) { return '<span class="ico ' + (cls || '') + '" style="display:inline-flex;width:1.1em;height:1.1em;vertical-align:-0.15em">' + Icons[name] + '</span>'; }
  function chip(text, cls) { return '<span class="chip ' + (cls || '') + '">' + esc(text) + '</span>'; }
  function moodPicker(name, value, title) {
    let html = '<div class="mood"><div class="between"><span class="eyebrow">' + esc(title) + '</span><span class="mood-readout"><span class="emoji">' + MoodScale.emoji(value) + '</span><span class="small">' + esc(MoodScale.label(value)) + (value ? ' · ' + value + '/10' : '') + '</span></span></div><div class="mood-scale" role="radiogroup" aria-label="' + esc(title) + '">';
    for (let i = 1; i <= 10; i++) html += '<button type="button" role="radio" aria-pressed="' + (value === i) + '" aria-checked="' + (value === i) + '" data-action="mood" data-name="' + name + '" data-value="' + i + '">' + i + '</button>';
    html += '</div><div class="between tiny muted"><span>Very low</span><span>Great</span></div></div>';
    return html;
  }
  function sparkline(values, opts) {
    opts = opts || {};
    const w = 320, h = opts.height || 100, pad = 10, min = opts.min != null ? opts.min : Math.min(...values), max = opts.max != null ? opts.max : Math.max(...values);
    const n = values.length;
    if (n < 2) return '';
    const x = (i) => pad + (i / (n - 1)) * (w - 2 * pad);
    const y = (v) => pad + (1 - (v - min) / ((max - min) || 1)) * (h - 2 * pad);
    const pts = values.map((v, i) => x(i) + ',' + y(v));
    let svg = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.label || 'chart') + '">';
    svg += '<line class="grid" x1="' + pad + '" x2="' + (w - pad) + '" y1="' + y(max) + '" y2="' + y(max) + '"/>';
    svg += '<line class="grid" x1="' + pad + '" x2="' + (w - pad) + '" y1="' + y(min) + '" y2="' + y(min) + '"/>';
    if (opts.zero != null && opts.zero >= min && opts.zero <= max) svg += '<line class="zero" x1="' + pad + '" x2="' + (w - pad) + '" y1="' + y(opts.zero) + '" y2="' + y(opts.zero) + '"/>';
    if (opts.area) svg += '<path class="area" d="M' + x(0) + ',' + y(opts.zero != null ? opts.zero : min) + ' L' + pts.join(' L') + ' L' + x(n - 1) + ',' + y(opts.zero != null ? opts.zero : min) + ' Z"/>';
    svg += '<polyline class="line" points="' + pts.join(' ') + '"/>';
    values.forEach((v, i) => { svg += '<circle class="dot" cx="' + x(i) + '" cy="' + y(v) + '" r="4"><title>' + esc(opts.format ? opts.format(v, i) : String(v)) + '</title></circle>'; });
    if (opts.startLabel) svg += '<text x="' + pad + '" y="' + (h - 1) + '">' + esc(opts.startLabel) + '</text>';
    if (opts.endLabel) svg += '<text x="' + (w - pad) + '" y="' + (h - 1) + '" text-anchor="end">' + esc(opts.endLabel) + '</text>';
    svg += '</svg>';
    return svg;
  }
  function moodTrendChart(sessions) {
    const rows = sessions.filter((s) => s.moodBefore || s.moodAfter).slice(0, 12).reverse();
    if (rows.length < 2) return '';
    const w = 320, h = 130, pad = 12;
    const x = (i) => pad + (i / (rows.length - 1)) * (w - 2 * pad);
    const y = (v) => pad + (1 - (v - 1) / 9) * (h - 2 * pad - 12);
    let svg = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Mood before and after each session">';
    [1, 5, 10].forEach((g) => { svg += '<line class="grid" x1="' + pad + '" x2="' + (w - pad) + '" y1="' + y(g) + '" y2="' + y(g) + '"/><text x="0" y="' + (y(g) + 4) + '">' + g + '</text>'; });
    const before = rows.map((s, i) => (s.moodBefore ? x(i) + ',' + y(s.moodBefore) : null)).filter(Boolean);
    const after = rows.map((s, i) => (s.moodAfter ? x(i) + ',' + y(s.moodAfter) : null)).filter(Boolean);
    if (before.length > 1) svg += '<polyline class="line before" points="' + before.join(' ') + '"/>';
    if (after.length > 1) svg += '<polyline class="line" points="' + after.join(' ') + '"/>';
    rows.forEach((s, i) => {
      if (s.moodBefore) svg += '<circle class="dot before" cx="' + x(i) + '" cy="' + y(s.moodBefore) + '" r="4"><title>' + esc(Fmt.shortDate(s.createdAt) + ' · before ' + s.moodBefore + '/10') + '</title></circle>';
      if (s.moodAfter) svg += '<circle class="dot" cx="' + x(i) + '" cy="' + y(s.moodAfter) + '" r="4"><title>' + esc(Fmt.shortDate(s.createdAt) + ' · after ' + s.moodAfter + '/10') + '</title></circle>';
    });
    svg += '<text x="' + pad + '" y="' + (h - 1) + '">' + esc(Fmt.shortDate(rows[0].createdAt)) + '</text><text x="' + (w - pad) + '" y="' + (h - 1) + '" text-anchor="end">' + esc(Fmt.shortDate(rows[rows.length - 1].createdAt)) + '</text></svg>';
    svg += '<div class="legend"><span><i class="before"></i>Before</span><span><i></i>After</span></div>';
    return svg;
  }
  function sessionTitle(s) { return Exporter.title(s); }
  function topThemes(s, n) { return s.insights && s.insights.themes ? s.insights.themes.slice(0, n) : []; }
  function openItems() {
    const out = [];
    for (const s of S.sessions) for (const it of (s.actionItems || [])) if (!it.isDone) out.push({ sessionId: s.id, sessionTitle: sessionTitle(s), sessionDate: s.createdAt, item: it });
    return out;
  }
  function pendingQuestions() {
    const out = []; const seen = new Set();
    for (const s of S.sessions) for (const q of (s.nextSessionQuestions || [])) { const k = q.trim().toLowerCase(); if (k && !seen.has(k)) { seen.add(k); out.push({ sessionId: s.id, sessionTitle: sessionTitle(s), question: q }); } }
    return out;
  }
  function recurringThemes() {
    const counts = new Map();
    for (const s of S.sessions) { const names = new Set(topThemes(s, 99).map((t) => t.name)); for (const n of names) counts.set(n, (counts.get(n) || 0) + 1); }
    return Array.from(counts, ([name, sessionCount]) => ({ name, sessionCount })).filter((t) => t.sessionCount >= 2).sort((a, b) => b.sessionCount - a.sessionCount);
  }
  function supportCard() {
    return '<div class="card" style="border-color:var(--accent)"><div class="card-title">' + icon('heart') + '<h3>You deserve support</h3></div><p class="small">Some of what was said sounds heavy. If things feel unsafe, please reach out — you do not have to carry it alone.</p><div class="stack">' +
      Lexicon.supportResources.map((r) => '<div><b>' + esc(r.title) + '</b><div class="small muted">' + esc(r.detail) + '</div></div>').join('') + '</div></div>';
  }
  function emptyState(text, sub) { return '<div class="empty">' + Icons.wave + '<p>' + esc(text) + '</p>' + (sub ? '<p class="small">' + esc(sub) + '</p>' : '') + '</div>'; }

  // ---------- screens ----------
  function topbar(title, opts) {
    opts = opts || {};
    return '<header class="topbar">' + (opts.back ? '<button class="back" data-action="back" aria-label="Back">' + Icons.back + '<span>' + esc(opts.back) + '</span></button>' : '') + '<h1>' + esc(title) + '</h1>' + (opts.right || '') + '</header>';
  }
  function tabbar() {
    if (['onboarding'].includes(S.route.name)) return '';
    const tabs = [['home', 'Home', 'home'], ['sessions', 'Sessions', 'list'], ['prepare', 'Prepare', 'checklist'], ['settings', 'Settings', 'gear']];
    const current = S.route.name === 'session' ? 'sessions' : (['how', 'notes'].includes(S.route.name) ? 'settings' : S.route.name);
    return '<nav class="tabbar" aria-label="Main">' + tabs.map(([r, label, ic]) => '<button data-action="nav" data-route="' + r + '" ' + (current === r ? 'aria-current="page"' : '') + '>' + Icons[ic] + '<span>' + label + '</span></button>').join('') + '</nav>';
  }

  function onboardingHTML() {
    return '<main class="screen"><div class="onboard">' +
      '<div class="glyph">' + Icons.mic + '</div><h1>Therapist Copilot</h1>' +
      '<p class="read">Record your therapy session, read it back as a transcript, and get a plain-language summary with practical suggestions for the week.</p>' +
      '<div class="card"><div class="card-title">' + icon('shield') + '<h3>Private by design</h3></div><p class="small">Everything stays in this browser on this device: the recording, the transcript, the notes. There are no accounts and no servers behind this app. Transcription uses your device\'s built-in speech recognition' + (/iPhone|iPad|Macintosh/.test(navigator.userAgent) ? ' (on Apple devices that is the same dictation service as your keyboard)' : '') + '.</p></div>' +
      '<div class="card"><div class="card-title">' + icon('info') + '<h3>Two things to know</h3></div><p class="small"><b>Ask before you record.</b> In many places recording a conversation needs everyone\'s consent. Tell your therapist and ask first.</p><p class="small"><b>Keep the screen on while recording.</b> Browsers pause audio when the screen locks or the app goes to the background. The app keeps the screen awake for you; just leave it open.</p><p class="small"><b>Not medical advice.</b> This is a reflection aid. It does not replace your therapist.</p></div>' +
      '<button class="btn primary block" data-action="finishOnboarding">I understand, let\'s start</button>' +
      '</div></main>';
  }

  function homeHTML() {
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Good morning' : (hour < 18 ? 'Good afternoon' : 'Good evening');
    const last = S.sessions[0];
    const items = openItems().slice(0, 3);
    const qs = pendingQuestions().slice(0, 2);
    const moods = S.sessions.filter((s) => s.moodAfter).slice(0, 10).reverse();
    let html = '<main class="screen">' + topbar(greet) + '<p class="muted" style="margin-top:-10px">' + esc(Fmt.weekday(new Date())) + '</p>';
    html += '<div class="hero"><button class="rec-btn" data-action="openPreSession" aria-label="Start a session">' + Icons.mic + '</button><div><b>Start a session</b><div class="small muted">Records, transcribes and summarizes on this device</div></div></div>';
    if (!S.sessions.length) {
      html += '<div class="card plain"><h3>After your first session you will see</h3><ul class="bullets small"><li>A transcript you can search, edit and replay.</li><li>A summary with themes, emotions, key moments and thinking patterns.</li><li>Suggestions for the week and questions to bring next time.</li></ul></div>';
    } else {
      html += '<div class="card"><div class="card-title">' + icon('wave') + '<h3>Last session</h3><span class="small muted">' + esc(Fmt.relative(last.createdAt)) + '</span></div>' +
        '<button class="row" data-action="openSession" data-id="' + last.id + '" style="padding:0"><div class="grow"><div class="title">' + esc(sessionTitle(last)) + '</div><div class="sub">' + esc(Fmt.durationWords(last.duration || 0)) + (last.moodBefore || last.moodAfter ? ' · ' + MoodScale.emoji(last.moodBefore) + ' → ' + MoodScale.emoji(last.moodAfter) : '') + (last.actionItems && last.actionItems.some((a) => !a.isDone) ? ' · ' + Fmt.plural(last.actionItems.filter((a) => !a.isDone).length, 'open item') : '') + '</div></div><span class="chev">' + Icons.chevron + '</span></button>' +
        (topThemes(last, 3).length ? '<div class="chips">' + topThemes(last, 3).map((t) => chip(t.name)).join('') + '</div>' : '') + '</div>';
      html += '<div class="stat-row"><div class="stat"><b>' + S.sessions.length + '</b><span>sessions</span></div><div class="stat"><b>' + openItems().length + '</b><span>open commitments</span></div><div class="stat"><b>' + Fmt.durationWords(S.sessions.reduce((a, s) => a + (s.duration || 0), 0)).replace(' min', 'm').replace(' h ', 'h ') + '</b><span>recorded</span></div></div>';
    }
    if (items.length || qs.length) {
      html += '<div class="card"><div class="card-title">' + icon('checklist') + '<h3>Up next</h3><button class="btn ghost small" data-action="nav" data-route="prepare">See all</button></div>';
      html += items.map((o) => '<div class="check"><button class="box" role="checkbox" aria-checked="false" data-action="toggleItem" data-session="' + o.sessionId + '" data-item="' + o.item.id + '" aria-label="Mark done"></button><div class="txt">' + esc(o.item.text) + '<div class="tiny muted">' + esc(o.sessionTitle) + '</div></div></div>').join('');
      html += qs.map((q) => '<div class="check"><span style="color:var(--accent);flex:none;margin-top:2px">' + icon('bubble') + '</span><div class="txt">' + esc(q.question) + '<div class="tiny muted">Question to bring</div></div></div>').join('');
      html += '</div>';
    }
    if (moods.length >= 2) {
      html += '<div class="card"><div class="card-title">' + icon('heart') + '<h3>Mood after sessions</h3></div>' + sparkline(moods.map((s) => s.moodAfter), { min: 1, max: 10, height: 110, label: 'Mood after each session', format: (v, i) => Fmt.shortDate(moods[i].createdAt) + ' · ' + v + '/10', startLabel: Fmt.shortDate(moods[0].createdAt), endLabel: Fmt.shortDate(moods[moods.length - 1].createdAt) }) + '</div>';

  function sessionsHTML() {
    const q = S.ui.search.trim().toLowerCase();
    const rows = S.sessions.filter((s) => {
      if (!q) return true;
      const hay = [sessionTitle(s), s.therapistName, (s.segments || []).map((g) => g.text).join(' '), topThemes(s, 99).map((t) => t.name).join(' '), (s.tags || []).join(' ')].join(' ').toLowerCase();
      return hay.includes(q);
    });
    let html = '<main class="screen">' + topbar('Sessions', { right: '<span class="small muted">' + S.sessions.length + '</span>' });
    html += '<input class="input" id="search" type="search" placeholder="Search titles, transcripts, themes" value="' + esc(S.ui.search) + '" data-field="search" autocomplete="off">';
    if (!S.sessions.length) html += emptyState('No sessions yet', 'Your first recording will appear here with its transcript and summary.');
    else if (!rows.length) html += emptyState('No results for “' + S.ui.search + '”');
    else {
      let month = null;
      html += '<div id="session-list" class="stack">';
      let open = false;
      for (const s of rows) {
        const m = Fmt.monthLabel(s.createdAt);
        if (m !== month) { if (open) html += '</div>'; month = m; html += '<div class="section-label">' + esc(m) + '</div><div class="list">'; open = true; }
        html += '<button class="row" data-action="openSession" data-id="' + s.id + '"><div class="grow"><div class="title">' + esc(sessionTitle(s)) + '</div><div class="sub">' + esc(Fmt.shortDate(s.createdAt)) + ' · ' + esc(Fmt.durationWords(s.duration || 0)) + (s.moodBefore || s.moodAfter ? ' · ' + MoodScale.emoji(s.moodBefore) + '→' + MoodScale.emoji(s.moodAfter) : '') + '</div>' +
          '<div class="chips" style="margin-top:6px">' + topThemes(s, 2).map((t) => chip(t.name)).join('') + (!(s.segments || []).length ? chip('Audio only', 'gray') : '') + (s.recovered ? chip('Recovered', 'warn') : '') + '</div></div><span class="chev">' + Icons.chevron + '</span></button>';
      }
      if (open) html += '</div>';
      html += '</div>';
    }
    html += '</main>';
    return html;
  }

  function sessionDetailHTML(id) {
    const s = getSession(id);
    if (!s) return '<main class="screen">' + topbar('Session', { back: 'Sessions' }) + emptyState('This session no longer exists.') + '</main>';
    const ins = s.insights;
    let html = '<main class="screen">' + topbar('', { back: 'Sessions', right: '<div class="menu-anchor"><button class="icon-btn" data-action="menu" aria-label="More" aria-expanded="' + S.ui.menu + '">' + Icons.more + '</button>' + (S.ui.menu ? menuHTML(s) : '') + '</div>' });
    html += '<div class="detail-head"><h1>' + esc(sessionTitle(s)) + '</h1><div class="meta"><span>' + esc(Fmt.dateTime(s.createdAt)) + '</span><span>' + esc(Fmt.durationWords(s.duration || 0)) + '</span>' + (s.therapistName ? '<span>with ' + esc(s.therapistName) + '</span>' : '') + '</div>' +
      '<div class="hstack small"><span>Before ' + MoodScale.emoji(s.moodBefore) + (s.moodBefore ? ' ' + s.moodBefore : '') + '</span><span class="muted">→</span><span>After ' + MoodScale.emoji(s.moodAfter) + (s.moodAfter ? ' ' + s.moodAfter : '') + '</span>' + (ins ? chip(ins.engine === 'onDeviceModel' ? 'On-device AI' : 'Classic analysis', 'gray') : '') + (s.recovered ? chip('Recovered after an interruption', 'warn') : '') + '</div></div>';
    if (s.hasAudio) html += playerHTML(s);

    if (ins && ins.needsSupportFlag) html += supportCard();

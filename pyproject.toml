[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesuvius-tifxyz-safety"
version = "0.1.0"
description = "Transactional TIFXYZ metadata repair and allocation preflight for Vesuvius Challenge workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Art"}]
dependencies = ["numpy>=1.24", "tifffile>=2023.7.10"]
keywords = ["vesuvius", "tifxyz", "papyrus", "virtual-unwrapping", "mesh"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tifxyz-safety = "vesuvius_tifxyz_safety.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

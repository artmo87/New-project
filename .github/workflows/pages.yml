# Publishes the web app to GitHub Pages on every push to main or the claude/therapist-copilot branch.
# If Pages is not enabled yet, the configure step tries to enable it; otherwise enable it once in
# Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/therapist-copilot]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r index.html manifest.webmanifest sw.js assets js dist site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
